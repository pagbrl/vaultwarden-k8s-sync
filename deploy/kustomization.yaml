apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The bootstrap Secret is intentionally NOT included here — it must be applied
# out-of-band (see bootstrap-secret.example.yaml). Keep real credentials out of
# version control.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - cronjob.yaml

commonLabels:
  app.kubernetes.io/part-of: vaultwarden-k8s-sync

images:
  - name: ghcr.io/osmose-club-hotels/vaultwarden-k8s-sync
    newTag: "0.2.0"
