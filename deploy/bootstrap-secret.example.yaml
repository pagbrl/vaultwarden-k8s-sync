# Bootstrap credentials for the syncer itself.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ COLD-START CIRCULARITY WARNING                                            │
# │                                                                          │
# │ These credentials MUST live OUTSIDE Vaultwarden. This tool's job is to   │
# │ pull secrets *out of* Vaultwarden — so it cannot fetch its own login     │
# │ from Vaultwarden without a chicken-and-egg deadlock. Store/apply this    │
# │ Secret via your bootstrap channel (sealed-secrets, SOPS, a one-time      │
# │ `kubectl apply` from an admin workstation, your cloud secret manager,    │
# │ etc.) and keep it out of Vaultwarden.                                    │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Do NOT commit real values. Everything below is REDACTED.
#
# Create it out-of-band, e.g.:
#   kubectl -n vaultwarden-sync create secret generic vaultwarden-bootstrap \
#     --from-literal=BW_PASSWORD='REDACTED' \
#     --from-literal=BW_CLIENTID='REDACTED' \
#     --from-literal=BW_CLIENTSECRET='REDACTED'
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-bootstrap
  namespace: vaultwarden-sync
  labels:
    app.kubernetes.io/name: vaultwarden-k8s-sync
type: Opaque
stringData:
  # Master password used to unlock the vault. Required.
  BW_PASSWORD: "REDACTED"
  # API-key credentials, used for the initial `bw login --apikey`.
  # Required unless the container image ships an already-logged-in bw profile.
  BW_CLIENTID: "REDACTED"
  BW_CLIENTSECRET: "REDACTED"
