name: image

# Publishes the container image to GHCR on a version tag.
#
# Why this is separate from ci.yml: ci runs on every push and pull request and
# must stay fast; this builds an image and takes minutes. Kept apart, a failed
# image build never hides a failed test, and a tag never waits on the test matrix
# of an unrelated branch.
#
# Before the first tag, one thing must be done by hand, once: GHCR creates a new
# package PRIVATE even when the repository is public. Push a tag, then set the
# package to public in its settings — otherwise consumers get
# `denied: denied` on pull, which reads like a credentials problem and is not one.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Lets a tag whose build failed on a transient error be republished without
  # moving or deleting the tag.
  workflow_dispatch:

permissions:
  contents: read
  # The only write GHCR needs. GITHUB_TOKEN is enough: no PAT to create, store
  # or rotate, and nothing to leak.
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/<owner>/<repo>, never hardcoded: a fork publishes to its own
          # namespace instead of failing on permissions here.
          images: ghcr.io/${{ github.repository }}
          # The exact version and nothing else — no `latest`, no `0.3` that moves
          # with each patch. Consumers pin a version (or a digest) in their GitOps
          # repo, and this component reads every secret of a cluster: a moving tag
          # is the one place a surprise upgrade must not be possible.
          tags: |
            type=semver,pattern={{version}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 only: the consumers are Elastic Metal x86 nodes. arm64 would add
          # several minutes of QEMU-emulated `npm install -g @bitwarden/cli` for a
          # platform nobody runs. One line to add the day that changes.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is what a GitOps repo should pin, not the tag. Printed in the
      # summary so it can be copied without digging through the build log.
      - name: Digest
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
